<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>考研陪伴 · MPAcc</title>
<style>
/* ===== THEME ===== */
:root {
  --bg: #f5f5f7; --bg2: #fff; --bg3: #e5e5e7;
  --border: #d1d1d6; --text: #1d1d1f; --text2: #86868b; --text3: #aeaeb2;
  --accent: #0071e3; --accent2: #e8f4fd;
  --success: #34c759; --warning: #ff9f0a; --error: #ff3b30;
  --pink: #f093fb; --purple: #764ba2; --blue: #4facfe; --gold: #f6d365;
  --radius: 12px; --shadow: 0 2px 12px rgba(0,0,0,0.08);
}
@media (prefers-color-scheme:dark) {
  :root {
    --bg: #1d1d1f; --bg2: #2d2d2f; --bg3: #3d3d3f;
    --border: #424245; --text: #f5f5f7; --text2: #86868b; --text3: #636366;
    --accent: #0a84ff; --accent2: rgba(10,132,255,0.15);
    --shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; overflow:hidden; }
body {
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background: var(--bg); color: var(--text);
  display:flex; flex-direction:column;
  -webkit-tap-highlight-color: transparent;
}
/* ===== PAGES ===== */
#app { flex:1; overflow:hidden; position:relative; }
.page {
  position:absolute; top:0; left:0; width:100%; height:100%;
  overflow-y:auto; overflow-x:hidden;
  padding: 1.5rem 1.25rem 5rem;
  opacity:0; transform:translateY(10px);
  transition:opacity .25s,transform .25s;
  pointer-events:none;
}
.page.active { opacity:1; transform:translateY(0); pointer-events:auto; }
.page h2 { font-size:1.5rem; font-weight:700; margin-bottom:0.25rem; }
.page .sub { color:var(--text2); font-size:0.85rem; margin-bottom:1rem; }

/* ===== BOTTOM NAV ===== */
nav {
  display:flex; background:var(--bg2); border-top:1px solid var(--border);
  padding:0.5rem 0 env(safe-area-inset-bottom);
  flex-shrink:0; z-index:10;
}
nav .tab {
  flex:1; text-align:center; padding:0.4rem 0;
  font-size:0.7rem; color:var(--text2); cursor:pointer;
  transition:color .15s; user-select:none;
}
nav .tab.active { color:var(--accent); font-weight:600; }
nav .tab .ico { font-size:1.4rem; display:block; margin-bottom:2px; }

/* ===== COMPONENTS ===== */
.card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--radius); padding:1rem; margin-bottom:1rem;
}
.btn {
  display:inline-block; padding:0.5rem 1.25rem; border-radius:8px;
  font-size:0.85rem; font-weight:600; cursor:pointer; border:none;
  background:var(--accent); color:#fff; transition:opacity .15s;
}
.btn:hover { opacity:0.85; }
.btn-sm { padding:0.35rem 0.85rem; font-size:0.78rem; }
.btn-outline { background:transparent; border:2px solid var(--border); color:var(--text); }
.btn-danger { background:var(--error); }

.task-item {
  display:flex; align-items:center; gap:0.75rem;
  background:var(--bg); border-radius:10px; padding:0.85rem 1rem;
  margin-bottom:0.6rem; position:relative;
  border-left:4px solid var(--accent);
  transition:opacity .3s;
}
.task-item.done { opacity:0.5; border-left-color:var(--success); }
.task-item .check {
  width:24px; height:24px; border:2px solid var(--border);
  border-radius:6px; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; cursor:pointer; font-size:0.7rem; color:var(--text3);
}
.task-item.done .check { background:var(--success); border-color:var(--success); color:#fff; }
.task-item .info { flex:1; }
.task-item .info strong { font-size:0.9rem; display:block; }
.task-item .info span { color:var(--text2); font-size:0.75rem; }
.task-item .actions {
  display:flex; gap:0.4rem; align-items:center;
}
.task-item .actions span { cursor:pointer; font-size:0.85rem; }
.task-item .actions .edit { color:var(--text2); }
.task-item .actions .del { color:var(--error); }

/* greeting */
.greet { margin-bottom:1.25rem; }
.greet .top { display:flex; justify-content:space-between; align-items:flex-start; }
.greet h1 { font-size:1.6rem; font-weight:700; }
.greet .countdown {
  text-align:center; background:var(--bg3); border-radius:16px;
  padding:0.6rem 1rem; min-width:70px;
}
.greet .countdown .num { font-size:2.2rem; font-weight:800; color:var(--accent); line-height:1; }
.greet .countdown .unit { font-size:0.65rem; color:var(--text2); }
.greet .msg {
  background:linear-gradient(135deg,rgba(240,147,251,0.12),rgba(245,87,108,0.08));
  border-radius:8px; padding:0.75rem 1rem; font-style:italic;
  color:var(--text2); font-size:0.85rem; margin-top:0.75rem;
}
.greet .msg .author { font-size:0.7rem; color:var(--text3); display:block; margin-top:0.25rem; }

/* points bar */
.pts-bar {
  display:flex; align-items:center; justify-content:space-between;
  background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--radius); padding:0.85rem 1rem; margin-bottom:1rem;
}
.pts-bar .pts { display:flex; align-items:center; gap:0.4rem; }
.pts-bar .pts .n { font-weight:700; font-size:1.2rem; }
.pts-bar .pts .l { color:var(--text2); font-size:0.7rem; }
.pts-bar .streak { text-align:right; }
.pts-bar .streak .v { font-weight:700; color:var(--success); }

/* store item */
.store-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:0.75rem; }
.store-item {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--radius); padding:1rem; text-align:center;
  display:flex; flex-direction:column; gap:0.4rem;
}
.store-item .emoji { font-size:2rem; }
.store-item h3 { font-size:0.9rem; }
.store-item .desc { color:var(--text2); font-size:0.75rem; }
.store-item .cost { font-weight:700; font-size:1rem; }
.store-item .cost small { color:var(--text2); font-weight:400; }

/* secret msg */
.secret-item {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--radius); padding:1rem; display:flex; align-items:center;
  gap:1rem; margin-bottom:0.6rem;
}
.secret-item.locked { opacity:0.55; }
.secret-item .ico { font-size:2rem; flex-shrink:0; }
.secret-item .body { flex:1; }
.secret-item .body strong { font-size:0.9rem; }
.secret-item .body p { color:var(--text2); font-size:0.8rem; margin:0.15rem 0; }
.secret-item .body .hint { font-size:0.72rem; color:var(--text3); }

/* achievements */
.ach-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:0.6rem; }
.ach-card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--radius); padding:1rem; text-align:center;
  transition:all .2s;
}
.ach-card.unlocked { border-color:var(--success); background:rgba(52,199,89,0.06); }
.ach-card.locked { opacity:0.55; }
.ach-card .ach-icon { font-size:2.2rem; margin-bottom:0.35rem; }
.ach-card .ach-name { font-weight:700; font-size:0.85rem; margin-bottom:0.2rem; }
.ach-card .ach-desc { color:var(--text2); font-size:0.72rem; }
.ach-card .ach-hint { font-size:0.65rem; color:var(--text3); margin-top:0.3rem; }

/* achievement popup */
.ach-popup {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.6); z-index:100;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .4s;
}
.ach-popup.show { opacity:1; }
.ach-popup-inner {
  background:var(--bg2); border-radius:20px; padding:2rem;
  text-align:center; max-width:300px; width:85%;
  animation:achBounce 0.5s ease;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
}
@keyframes achBounce {
  0% { transform:scale(0.3); opacity:0; }
  50% { transform:scale(1.08); }
  100% { transform:scale(1); opacity:1; }
}
.ach-popup-badge { font-size:3rem; margin-bottom:0.3rem; animation:achSpin 0.6s ease; }
@keyframes achSpin {
  0% { transform:rotate(-30deg) scale(0); }
  100% { transform:rotate(0) scale(1); }
}
.ach-popup-label { font-size:0.85rem; color:var(--success); font-weight:700; margin-bottom:0.75rem; letter-spacing:0.05em; }
.ach-popup-icon { font-size:3.5rem; margin-bottom:0.5rem; }
.ach-popup-name { font-size:1.2rem; font-weight:700; margin-bottom:0.3rem; }
.ach-popup-desc { color:var(--text2); font-size:0.85rem; line-height:1.4; }

/* active task */
.task-item.active { border-left-color:var(--warning)!important; background:rgba(255,159,10,0.06); }
.task-item.active .info strong { color:var(--warning); }
.task-item .task-badge {
  display:inline-block; font-size:0.65rem; padding:0.15rem 0.5rem;
  border-radius:10px; font-weight:600;
}
.task-item .task-badge.active-badge { background:rgba(255,159,10,0.2); color:var(--warning); }
.completed-label { color:var(--success); font-size:0.75rem; font-weight:600; }

/* data */
.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.6rem; margin-bottom:1rem; }
.stat-card { background:var(--bg); border-radius:10px; padding:0.75rem; text-align:center; }
.stat-card .v { font-size:1.6rem; font-weight:700; }
.stat-card .l { font-size:0.7rem; color:var(--text2); }
.bar-row { margin-bottom:0.6rem; }
.bar-row .label { display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:0.2rem; }
.bar-row .bar {
  height:8px; background:var(--bg3); border-radius:4px; overflow:hidden;
}
.bar-row .bar .fill { height:100%; border-radius:4px; }
.calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center; }
.calendar .dayh { color:var(--text3); font-size:0.62rem; padding:2px; font-weight:500; }
.calendar .day {
  aspect-ratio:1; border-radius:5px; font-size:0.7rem;
  display:flex; align-items:center; justify-content:center;
  cursor:default; position:relative; transition:transform .12s;
  color:var(--text3);
}
.calendar .day:hover { transform:scale(1.2); z-index:2; }
.calendar .day.l0 { background:var(--bg3); }
.calendar .day.l1 { background:#a5d6a7; color:rgba(0,0,0,0.6); }
.calendar .day.l2 { background:#66bb6a; color:#fff; }
.calendar .day.l3 { background:#43a047; color:#fff; }
.calendar .day.l4 { background:#1b5e20; color:#fff; font-weight:700; }
.calendar .day.today { box-shadow:0 0 0 2px var(--accent); color:var(--text); font-weight:700; }
.calendar .day.empty { background:transparent; }
.calendar .day .tooltip {
  display:none; position:absolute; bottom:120%; left:50%; transform:translateX(-50%);
  background:var(--text); color:var(--bg); font-size:0.65rem; padding:3px 8px;
  border-radius:4px; white-space:nowrap; z-index:5;
}
.calendar .day:hover .tooltip { display:block; }
.cal-month-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:0.75rem; }
.cal-month-nav button {
  background:none; border:none; font-size:1.2rem; cursor:pointer;
  color:var(--text2); padding:0.25rem 0.5rem;
}
.cal-month-nav .month-label { font-weight:600; font-size:0.9rem; }
.cal-legend { display:flex; align-items:center; gap:0.4rem; margin-top:0.6rem; font-size:0.65rem; color:var(--text3); }
.cal-legend .dot { width:12px; height:12px; border-radius:3px; }
@media (prefers-color-scheme:dark) {
  .calendar .day.l1 { background:rgba(102,187,106,0.35); color:#fff; }
  .calendar .day.l2 { background:rgba(102,187,106,0.55); color:#fff; }
  .calendar .day.l3 { background:rgba(76,175,80,0.65); color:#fff; }
  .calendar .day.l4 { background:#66bb6a; color:#fff; font-weight:700; }
}

/* admin */
.admin-overlay {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background:var(--bg); z-index:30; overflow-y:auto; padding:1.5rem 1.25rem;
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.admin-overlay.on { opacity:1; pointer-events:auto; }
.admin-overlay h2 { margin-bottom:1rem; }
.form-group { margin-bottom:0.75rem; }
.form-group label { display:block; font-size:0.8rem; color:var(--text2); margin-bottom:0.25rem; }
.form-group input,.form-group textarea,.form-group select {
  width:100%; padding:0.6rem; border:1px solid var(--border); border-radius:8px;
  font-size:0.9rem; background:var(--bg2); color:var(--text);
  font-family:inherit;
}
.form-group textarea { min-height:60px; resize:vertical; }

/* modal */
.modal {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.5); z-index:50;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.modal.on { opacity:1; pointer-events:auto; }
.modal .box {
  background:var(--bg2); border-radius:var(--radius);
  padding:1.5rem; max-width:360px; width:90%; box-shadow:var(--shadow);
}
.modal .box h3 { margin-bottom:0.75rem; }

/* animations */
@keyframes floatUp {
  0% { opacity:1; transform:translateY(0); }
  100% { opacity:0; transform:translateY(-60px); }
}
.float-pts {
  position:fixed; top:40%; left:50%; z-index:100;
  font-size:2rem; font-weight:800; color:var(--accent);
  animation:floatUp 1.5s ease-out forwards; pointer-events:none;
}
@keyframes stamp {
  0% { transform:scale(2) rotate(-15deg); opacity:0; }
  100% { transform:scale(1) rotate(0); opacity:1; }
}
.stamp-anim {
  animation:stamp 0.5s ease-out forwards;
  font-size:3rem; text-align:center; margin:1rem 0;
}

/* check-in */
.checkin-card {
  background:var(--bg2); border:2px dashed var(--border);
  border-radius:var(--radius); padding:0.85rem 1rem;
  margin-bottom:1rem; cursor:pointer;
  transition:all .25s; user-select:none;
}
.checkin-card:hover { border-color:var(--accent); background:var(--accent2); }
.checkin-card .checkin-inner {
  display:flex; align-items:center; gap:0.75rem;
}
.checkin-card.checked {
  border-style:solid; border-color:var(--success);
  background:rgba(52,199,89,0.08); cursor:default;
}
.checkin-card.checked .checkin-inner { opacity:0.8; }
@keyframes checkPop {
  0% { transform:scale(1); }
  50% { transform:scale(1.05); }
  100% { transform:scale(1); }
}
.checkin-card.popping { animation:checkPop 0.4s ease; }
.admin-fab {
  position:fixed; bottom:5rem; right:1rem; z-index:15;
  width:44px; height:44px; border-radius:50%; background:var(--bg3);
  border:1px solid var(--border); font-size:1.2rem;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; opacity:0.6; transition:opacity .2s;
}
.admin-fab:hover { opacity:1; }

@media (max-width:400px) {
  .page { padding:1rem 1rem 5rem; }
  .greet h1 { font-size:1.3rem; }
  .timer-screen .clock { font-size:4rem; }
  .store-grid { grid-template-columns:repeat(2,1fr); }
}
</style>
</head>
<body>

<div id="app">

<!-- ====== PAGE 0:  TODAY ====== -->
<div class="page active" id="page-today">
  <div class="greet">
    <div class="top">
      <div>
        <h1 id="greeting-text">早安，老婆 ☀️</h1>
        <div style="color:var(--text2);font-size:0.8rem;" id="date-text"></div>
      </div>
      <div class="countdown" id="countdown-box">
        <div class="num" id="cd-num">--</div>
        <div class="unit">天</div>
      </div>
    </div>
    <div class="msg" id="daily-msg">
      <span id="msg-content">今天的你，比昨天又多学了一天。慢慢来，我在呢。</span>
      <span class="author" id="msg-author">— 他今天想对你说的</span>
    </div>
  </div>

  <!-- daily check-in -->
  <div class="checkin-card" id="checkin-card" onclick="doCheckin()">
    <div class="checkin-inner" id="checkin-inner">
      <span style="font-size:1.8rem;">📝</span>
      <div>
        <strong>今日打卡签到</strong>
        <span style="display:block;color:var(--text2);font-size:0.78rem;">点这里，标记今天的努力 ✨</span>
      </div>
      <span style="font-size:1.5rem;color:var(--text3);">→</span>
    </div>
  </div>

  <div class="pts-bar" onclick="switchPage('store')">
    <div class="pts">
      <span style="font-size:1.5rem;">⭐</span>
      <div>
        <div class="n" id="pts-display">0</div>
        <div class="l">积分（1分钟=1积分）</div>
      </div>
    </div>
    <div style="text-align:right;">
      <div class="l">连续打卡</div>
      <div class="streak"><span style="font-size:1.1rem;">🔥</span> <span class="v" id="streak-display">0</span> 天</div>
    </div>
    <div style="background:var(--bg3);border-radius:8px;padding:0.4rem 0.6rem;font-size:0.8rem;cursor:pointer;">🎁 商城 →</div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
    <h2 style="margin:0;font-size:1.1rem;">今日任务</h2>
    <button class="btn btn-sm btn-outline" onclick="addTask()">+ 添加</button>
  </div>
  <div id="task-list"></div>
  <div style="text-align:center;margin-top:0.5rem;">
    <button class="btn btn-sm btn-outline" onclick="copyYesterday()" style="font-size:0.72rem;">📋 复制昨天的任务</button>
  </div>
  <div id="stamp-area"></div>
</div>

<!-- ====== PAGE 1: DATA ====== -->
<div class="page" id="page-data">
  <h2>📊 学习数据</h2>
  <p class="sub">偶尔翻翻，看看自己多厉害</p>
  <div class="stat-grid" id="stat-grid"></div>
  <div class="card">
    <div style="font-size:0.8rem;color:var(--text2);margin-bottom:0.75rem;">本周各科时间分布</div>
    <div id="subject-bars"></div>
  </div>
  <div class="card">
    <div class="cal-month-nav">
      <button onclick="prevMonth()">◀</button>
      <span class="month-label" id="cal-month-label"></span>
      <button onclick="nextMonth()">▶</button>
    </div>
    <div class="calendar" id="calendar"></div>
    <div class="cal-legend">
      <span>少</span>
      <span class="dot" style="background:var(--bg3)"></span>
      <span class="dot" style="background:#a5d6a7"></span>
      <span class="dot" style="background:#66bb6a"></span>
      <span class="dot" style="background:#43a047"></span>
      <span class="dot" style="background:#1b5e20"></span>
      <span>多</span>
      <span style="margin-left:0.5rem;">🔵 今天</span>
    </div>
  </div>
</div>

<!-- ====== PAGE 2: STORE ====== -->
<div class="page" id="page-store">
  <h2>🎁 积分商城</h2>
  <p class="sub">攒够了来兑奖 ✨</p>
  <div class="pts-bar">
    <div class="pts"><span style="font-size:1.5rem;">⭐</span><div><div class="n" id="pts-display2">0</div><div class="l">可用积分</div></div></div>
  </div>
  <div class="store-grid" id="store-grid"></div>
  <div style="margin-top:1.5rem;">
    <div style="font-size:0.85rem;color:var(--text2);margin-bottom:0.5rem;">兑换记录</div>
    <div id="redeem-log" style="font-size:0.8rem;color:var(--text2);"></div>
  </div>
</div>

<!-- ====== PAGE 3: SECRETS ====== -->
<div class="page" id="page-secrets">
  <h2>🏆 成就墙</h2>
  <p class="sub">每一步都值得记录</p>
  <div id="secret-list"></div>
</div>

<!-- ====== ADMIN OVERLAY ====== -->
<div class="admin-overlay" id="admin-overlay">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
    <h2 style="margin:0;">⚙ 管理员面板</h2>
    <span style="cursor:pointer;font-size:1.5rem;" onclick="closeAdmin()">✕</span>
  </div>

  <div style="margin-bottom:1.5rem;">
    <strong style="font-size:0.9rem;">🎁 奖品管理</strong>
    <div id="admin-prizes" style="margin-top:0.5rem;"></div>
    <button class="btn btn-sm btn-outline" onclick="addPrize()" style="margin-top:0.5rem;">+ 添加奖品</button>
  </div>

  <div style="margin-bottom:1.5rem;">
    <strong style="font-size:0.9rem;">🏆 成就管理</strong>
    <div id="admin-secrets" style="margin-top:0.5rem;"></div>
    <button class="btn btn-sm btn-outline" onclick="addAchievement()" style="margin-top:0.5rem;">+ 添加成就</button>
  </div>

  <div style="margin-bottom:1.5rem;">
    <strong style="font-size:0.9rem;">🌅 问候语管理</strong>
    <div id="admin-greetings" style="margin-top:0.5rem;"></div>

  </div>

  </div>

  </div>

<script>
// ====== DATA MODEL ======
const LS = {
  get(k,d) { try { const v=localStorage.getItem('kaoyan_'+k); return v?JSON.parse(v):d; } catch(e) { return d; } },
  set(k,v) { localStorage.setItem('kaoyan_'+k, JSON.stringify(v)); }
};

// Defaults
const DEFAULT_PRIZES = [
  {id:1,emoji:'🧋',name:'一杯奶茶',desc:'你请的奶茶最甜',cost:300},
  {id:2,emoji:'🎬',name:'一场电影',desc:'任选一部，我陪你看',cost:800},
  {id:3,emoji:'🍲',name:'一顿火锅',desc:'你说了算的火锅局',cost:1500},
  {id:4,emoji:'💆',name:'一次按摩',desc:'放松一下辛苦了',cost:500},
  {id:5,emoji:'🎁',name:'神秘礼物',desc:'攒到2000就知道了',cost:2000},
];
const DEFAULT_ACHIEVEMENTS = [
  {id:1,icon:'🌟',name:'初出茅庐',cond:'累计学习10分钟',condType:'points',condVal:10,desc:'累积了第一个10分钟，迈出了第一步！'},
  {id:2,icon:'🔥',name:'坚持一周',cond:'连续打卡7天',condType:'streak',condVal:7,desc:'连续7天打卡，习惯正在养成。'},
  {id:3,icon:'💪',name:'月度达人',cond:'连续打卡30天',condType:'streak',condVal:30,desc:'整整一个月风雨无阻，你是最棒的。'},
  {id:4,icon:'⏱',name:'时间富翁',cond:'累计学习600分钟',condType:'points',condVal:600,desc:'已经学了10个小时了，积少成多。'},
  {id:5,icon:'🏃',name:'马不停蹄',cond:'累计学习1800分钟',condType:'points',condVal:1800,desc:'30个小时的学习量，你在飞奔。'},
  {id:6,icon:'🎯',name:'冲刺阶段',cond:'倒计时100天',condType:'countdown',condVal:100,desc:'最后100天，全力冲刺！'},
  {id:7,icon:'📚',name:'学霸附体',cond:'累计学习3000分钟',condType:'points',condVal:3000,desc:'50个小时！学霸的称号你当之无愧。'},
  {id:8,icon:'🏆',name:'全勤王者',cond:'连续打卡60天',condType:'streak',condVal:60,desc:'两个月不间断，王者风范。'},
];

const DEFAULT_GREETINGS = [
  {id:1,text:'今天的你，比昨天又多学了一天。慢慢来，我在呢。',author:'他今天想对你说的'},
  {id:2,text:'老婆，又是新的一天。不管昨天怎么样，今天重新开始。',author:'他今天想对你说的'},
  {id:3,text:'早啊老婆。今天天气挺好的，适合学习。',author:'他今天想对你说的'},
  {id:4,text:'你知道吗，每天睁开眼睛第一个想到的就是你。加油。',author:'他今天想对你说的'},
  {id:5,text:'今天的你可能也会累，会想放弃。但记住，你已经坚持这么久了。',author:'他今天想对你说的'},
  {id:6,text:'老婆早安！今天也要开心呀～学习累了就歇歇，别硬撑。',author:'他今天想对你说的'},
  {id:7,text:'每天打开这个页面就知道你在努力。我为你骄傲。',author:'他今天想对你说的'},
  {id:8,text:'就算今天只学了10分钟，也比0分钟厉害。重要的是你动了。',author:'他今天想对你说的'},
  {id:9,text:'早！今天有没有特别难的科目要攻克？我相信你可以的。',author:'他今天想对你说的'},
  {id:10,text:'老婆，考研这条路上你不孤单。有我在。',author:'他今天想对你说的'},
];

// State
let state = {
  points: LS.get('points',0),
  totalMinutes: LS.get('totalMinutes',0),
  totalTomatoes: LS.get('totalTomatoes',0),
  streak: LS.get('streak',0),
  lastActiveDate: LS.get('lastActiveDate',''),
  tasks: LS.get('tasks',[]),
  prizes: LS.get('prizes',[...DEFAULT_PRIZES]),
  achievements: LS.get('achievements',[...DEFAULT_ACHIEVEMENTS]),
  greetings: LS.get('greetings',[...DEFAULT_GREETINGS]),
  redeemLog: LS.get('redeemLog',[]),
  examDate: LS.get('examDate','2026-12-20'),
  timerMinutes: {}, // {subject: totalMinutes}
  dailyActivity: LS.get('dailyActivity',{}), // {'2026-05-22': 85}
  calMonth: new Date().getMonth(),
  calYear: new Date().getFullYear(),
  checkedInDate: LS.get('checkedInDate',''), // '2026-05-22'
  activeTask: -1, // index of currently active task
};
// Merge timerMinutes from old format
let oldTM = LS.get('timerMinutes',{});
state.timerMinutes = Object.keys(oldTM).length>0 ? oldTM : {};

// ====== INIT ======
function init() {
  // Check today's streak
  const today = new Date().toISOString().slice(0,10);
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if (state.lastActiveDate === today) {
    // already active today
  } else if (state.lastActiveDate === yesterday) {
    state.streak += 1;
  } else {
    state.streak = 1;
  }
  state.lastActiveDate = today;
  saveState();

  // Check if url has ?admin
  if (window.location.search.includes('admin')) {
    openAdmin();
  }

  renderAll();
  updateCountdown();
  setInterval(updateCountdown, 60000);

  // Check midnight reset
  checkMidnightReset();
  setInterval(checkMidnightReset, 60000);
}

function saveState() {
  LS.set('points',state.points);
  LS.set('totalMinutes',state.totalMinutes);
  LS.set('totalTomatoes',state.totalTomatoes);
  LS.set('streak',state.streak);
  LS.set('lastActiveDate',state.lastActiveDate);
  LS.set('tasks',state.tasks);
  LS.set('prizes',state.prizes);
  LS.set('achievements',state.achievements);
  LS.set('greetings',state.greetings);
  LS.set('redeemLog',state.redeemLog);
  LS.set('examDate',state.examDate);
  LS.set('timerMinutes',state.timerMinutes);
  LS.set('dailyActivity',state.dailyActivity);
  LS.set('checkedInDate',state.checkedInDate);
}

let lastDate = new Date().toISOString().slice(0,10);
function checkMidnightReset() {
  const d = new Date().toISOString().slice(0,10);
  if (d !== lastDate) {
    // Save yesterday's tasks before resetting
    LS.set('yesterdayTasks', state.tasks.map(t => ({...t})));
    lastDate = d;
    // Reset tasks for new day
    state.tasks = state.tasks.map(t => ({...t, done:false}));
    saveState();
    renderToday();
  }
}

// ====== COUNTDOWN ======
function updateCountdown() {
  const exam = new Date(state.examDate);
  const now = new Date();
  const diff = Math.ceil((exam - now) / 86400000);
  const el = document.getElementById('cd-num');
  if (el) el.textContent = diff > 0 ? diff : '0';
}

// ====== RENDER ======
function renderAll() {
  renderToday();
  renderData();
  renderStore();
  renderSecrets();
  updatePointsDisplay();
}

function updatePointsDisplay() {
  document.getElementById('pts-display').textContent = state.points;
  document.getElementById('pts-display2').textContent = state.points;
  document.getElementById('streak-display').textContent = state.streak;
}

// ====== TODAY PAGE ======
function renderToday() {
  const today = new Date();
  const days = ['日','一','二','三','四','五','六'];
  document.getElementById('date-text').textContent =
    `今天是 ${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日 · 周${days[today.getDay()]}`;

  // Greeting based on time
  const h = today.getHours();
  let greet = '早安';
  if (h >= 12 && h < 18) greet = '下午好';
  if (h >= 18 || h < 5) greet = '晚安';
  document.getElementById('greeting-text').textContent = greet + '，老婆 ☀️';

  // Daily message
  if (state.greetings.length > 0) {
    const idx = today.getDate() % state.greetings.length;
    const g = state.greetings[idx];
    document.getElementById('msg-content').textContent = '「' + g.text + '」';
    document.getElementById('msg-author').textContent = '— ' + (g.author || '他今天想对你说的');
  }

  // Tasks
  const list = document.getElementById('task-list');
  const isActive = state.activeTask >= 0;
  list.innerHTML = state.tasks.length === 0
    ? '<div style="text-align:center;color:var(--text3);padding:2rem;">还没有任务，点「+ 添加」开始规划今天吧 ✨</div>'
    : state.tasks.map((t,i) => {
        let btnHtml = '';
        let statusBadge = '';
        let itemClass = '';
        if (t.done) {
          itemClass = 'done';
          statusBadge = '<span class="completed-label">✓ 已完成</span>';
        } else if (state.activeTask === i) {
          itemClass = 'active';
          statusBadge = '<span class="task-badge active-badge">⏳ 进行中</span>';
          btnHtml = `<button class="btn btn-sm" style="background:var(--success);" onclick="finishTask(${i})">✓ 完成</button>`;
        } else {
          btnHtml = `<button class="btn btn-sm" onclick="activateTask(${i})" ${isActive?'disabled':''}>开始</button>`;
        }
        return `
          <div class="task-item ${itemClass}" style="border-left-color:${t.color||'var(--accent)'};">
            <div class="check" onclick="toggleTask(${i})">${t.done?'✓':'□'}</div>
            <div class="info">
              <strong>${esc(t.name)} ${statusBadge}</strong>
              <span>目标：${t.minutes}分钟 · ≈${t.minutes} 积分</span>
            </div>
            ${t.done ? '' : btnHtml}
            <div class="actions" style="margin-left:0.5rem;">
              <span class="edit" onclick="editTask(${i})">✎</span>
              <span class="del" onclick="deleteTask(${i})">🗑</span>
            </div>
          </div>`;
      }).join('');

  renderCheckin();
  updatePointsDisplay();
}

function renderCheckin() {
  const card = document.getElementById('checkin-card');
  if (!card) return;
  const today = new Date().toISOString().slice(0,10);
  if (state.checkedInDate === today) {
    card.className = 'checkin-card checked';
    card.onclick = null;
    document.getElementById('checkin-inner').innerHTML = `
      <span style="font-size:1.8rem;">✅</span>
      <div>
        <strong style="color:var(--success);">今日已打卡</strong>
        <span style="display:block;color:var(--text2);font-size:0.78rem;">连续 ${state.streak} 天 🔥 明天继续加油</span>
      </div>
      <span style="font-size:1.2rem;">🔥</span>`;
  } else {
    card.className = 'checkin-card';
    card.onclick = doCheckin;
    document.getElementById('checkin-inner').innerHTML = `
      <span style="font-size:1.8rem;">📝</span>
      <div>
        <strong>今日打卡签到</strong>
        <span style="display:block;color:var(--text2);font-size:0.78rem;">点这里，标记今天的努力 ✨</span>
      </div>
      <span style="font-size:1.5rem;color:var(--text3);">→</span>`;
  }
}

function doCheckin() {
  const today = new Date().toISOString().slice(0,10);
  if (state.checkedInDate === today) return;
  state.checkedInDate = today;
  // Record minimal activity so calendar lights up
  if (!state.dailyActivity[today]) state.dailyActivity[today] = 1;
  state.points += 5;
  showFloatPts('+5 签到');
  saveState();
  updatePointsDisplay();
  renderCheckin();
  checkAchievements();
}

function esc(s) { return s.replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function toggleTask(i) {
  state.tasks[i].done = !state.tasks[i].done;
  saveState();
  renderToday();
  checkAllDone();
}

function checkAllDone() {
  if (state.tasks.length > 0 && state.tasks.every(t => t.done)) {
    const area = document.getElementById('stamp-area');
    if (!area.querySelector('.stamp-anim')) {
      state.points += 20;
      saveState();
      area.innerHTML = '<div class="stamp-anim">✅ 今日全部完成！<br><span style="font-size:1rem;">+20 额外积分</span></div>';
      updatePointsDisplay();
      showFloatPts('+20');
      setTimeout(() => { area.innerHTML = ''; }, 3000);
    }
  }
}

function addTask() {
  const html = `
    <h3>添加任务</h3>
    <div class="form-group"><label>科目</label>
      <select id="nt-subject">
        <option value="英语二">英语二</option><option value="初等数学">初等数学</option>
        <option value="逻辑">逻辑</option><option value="写作">写作</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="form-group"><label>任务名称</label><input id="nt-name" placeholder="如：阅读理解2篇"></div>
    <div class="form-group"><label>预计时长（分钟）</label><input id="nt-mins" type="number" value="45"></div>
    <div style="display:flex;gap:0.5rem;">
      <button class="btn btn-sm" onclick="doAddTask()">添加</button>
      <button class="btn btn-sm btn-outline" onclick="closeModal()">取消</button>
    </div>`;
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal').classList.add('on');
}

function doAddTask() {
  const subject = document.getElementById('nt-subject').value;
  const name = document.getElementById('nt-name').value.trim();
  const minutes = parseInt(document.getElementById('nt-mins').value)||45;
  if (!name) return alert('请输入任务名称');
  const colors = {'英语二':'var(--accent)','初等数学':'#764ba2','逻辑':'#4facfe','写作':'#f6d365'};
  state.tasks.push({name:`${subject} · ${name}`,subject,minutes,done:false,color:colors[subject]||'var(--accent)'});
  saveState();
  closeModal();
  renderToday();
}

function editTask(i) {
  const t = state.tasks[i];
  const html = `
    <h3>编辑任务</h3>
    <div class="form-group"><label>任务名称</label><input id="et-name" value="${esc(t.name)}"></div>
    <div class="form-group"><label>预计时长（分钟）</label><input id="et-mins" type="number" value="${t.minutes}"></div>
    <div style="display:flex;gap:0.5rem;">
      <button class="btn btn-sm" onclick="doEditTask(${i})">保存</button>
      <button class="btn btn-sm btn-outline" onclick="closeModal()">取消</button>
    </div>`;
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal').classList.add('on');
}

function doEditTask(i) {
  state.tasks[i].name = document.getElementById('et-name').value.trim();
  state.tasks[i].minutes = parseInt(document.getElementById('et-mins').value)||45;
  if (!state.tasks[i].name) return alert('名称不能为空');
  saveState();
  closeModal();
  renderToday();
}

function deleteTask(i) {
  if (confirm('确定删除「'+state.tasks[i].name+'」？')) {
    state.tasks.splice(i,1);
    saveState();
    renderToday();
  }
}

function copyYesterday() {
  const yesterday = LS.get('yesterdayTasks',[]);
  if (yesterday.length === 0) return alert('没有昨天的任务记录');
  state.tasks = yesterday.map(t => ({...t, done:false}));
  saveState();
  renderToday();
}
// ====== TASK ACTIONS ======
function activateTask(i) {
  if (state.tasks[i].done) return;
  state.activeTask = i;
  saveState();
  renderToday();
}

function finishTask(i) {
  const t = state.tasks[i];
  // Show modal to enter minutes
  const html = `
    <h3>✅ 任务完成</h3>
    <p style="color:var(--text2);font-size:0.85rem;margin-bottom:1rem;">${esc(t.name)}</p>
    <div class="form-group"><label>实际学习时长（分钟）</label>
      <input id="fm-mins" type="number" value="${t.minutes}" min="1" max="600" autofocus>
    </div>
    <p style="color:var(--text2);font-size:0.75rem;margin-bottom:1rem;">📱 看看你的计时软件上跑了多久，填进来就行</p>
    <div style="display:flex;gap:0.5rem;">
      <button class="btn btn-sm" onclick="doFinishTask(${i})">确认完成</button>
      <button class="btn btn-sm btn-outline" onclick="closeModal()">取消</button>
    </div>`;
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal').classList.add('on');
  // Focus the input
  setTimeout(() => { const inp = document.getElementById('fm-mins'); if (inp) inp.focus(); }, 100);
}

function doFinishTask(i) {
  const mins = parseInt(document.getElementById('fm-mins').value) || state.tasks[i].minutes;
  if (mins < 1) return alert('请输入有效的学习时间');
  state.tasks[i].done = true;
  state.activeTask = -1;
  // Award points
  awardPoints(mins, state.tasks[i].subject);
  saveState();
  closeModal();
  renderToday();
  renderData();
  showFloatPts('+' + mins);
  checkAllDone();
}

function awardPoints(mins, subject) {
  state.points += mins;
  state.totalMinutes += mins;
  // Track per subject
  if (subject) {
    state.timerMinutes[subject] = (state.timerMinutes[subject]||0) + mins;
  }
  // Track daily activity for heatmap
  const today = new Date().toISOString().slice(0,10);
  state.dailyActivity[today] = (state.dailyActivity[today]||0) + mins;
  // Check achievements
  saveState();
  checkAchievements();
}

// Remove old timerState
// timerState variable removed — no longer needed

function showFloatPts(text) {
  const el = document.createElement('div');
  el.className = 'float-pts';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

// ====== DATA PAGE ======
function renderData() {
  // Stats
  const grid = document.getElementById('stat-grid');
  grid.innerHTML = `
    <div class="stat-card"><div class="v">${state.totalMinutes}<span style="font-size:0.8rem;color:var(--text2);"> 分钟</span></div><div class="l">累计学习</div></div>
    <div class="stat-card"><div class="v" style="color:var(--success);">${state.streak}<span style="font-size:0.8rem;"> 天</span></div><div class="l">连续打卡</div></div>
    <div class="stat-card"><div class="v">${state.points}<span style="font-size:0.8rem;color:var(--text2);"> ⭐</span></div><div class="l">总积分</div></div>
    <div class="stat-card"><div class="v">${state.totalTomatoes}<span style="font-size:0.8rem;color:var(--text2);"> 🍅</span></div><div class="l">完成番茄</div></div>`;

  // Subject bars
  const subjects = {'英语二':'var(--accent)','初等数学':'#764ba2','逻辑':'#4facfe','写作':'#f6d365'};
  const maxMin = Math.max(1, ...Object.values(state.timerMinutes));
  const bars = document.getElementById('subject-bars');
  bars.innerHTML = Object.entries(state.timerMinutes).map(([s,m]) => `
    <div class="bar-row">
      <div class="label"><span>${s}</span><span style="color:var(--text2)">${m} 分钟</span></div>
      <div class="bar"><div class="fill" style="width:${(m/maxMin*100)}%;background:${subjects[s]||'var(--accent)'};"></div></div>
    </div>`).join('') || '<div style="color:var(--text3);font-size:0.8rem;">还没有学习记录</div>';

  // Calendar
  renderCalendar();
}

function renderCalendar() {
  const cal = document.getElementById('calendar');
  const calLabel = document.getElementById('cal-month-label');
  const year = state.calYear;
  const month = state.calMonth;
  const now = new Date();
  const todayStr = now.toISOString().slice(0,10);

  calLabel.textContent = `${year}年 ${month+1}月`;

  const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(year, month+1, 0).getDate();

  // Collect daily minutes for this month
  const maxMins = Math.max(1, ...Array.from({length:daysInMonth}, (_,d) => {
    const k = `${year}-${String(month+1).padStart(2,'0')}-${String(d+1).padStart(2,'0')}`;
    return state.dailyActivity[k]||0;
  }));

  function level(mins) {
    if (mins <= 0) return 'l0';
    if (mins <= 15) return 'l1';   // just checked in / quick session
    if (mins <= 45) return 'l2';   // a solid session
    if (mins <= 90) return 'l3';   // a great day
    return 'l4';                    // an awesome day
  }

  let html = '<div class="dayh">一</div><div class="dayh">二</div><div class="dayh">三</div><div class="dayh">四</div><div class="dayh">五</div><div class="dayh">六</div><div class="dayh">日</div>';
  const offset = firstDay === 0 ? 6 : firstDay - 1;
  for (let i = 0; i < offset; i++) html += '<div class="day empty"></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const mins = state.dailyActivity[key]||0;
    const isToday = key === todayStr;
    let cls = 'day ' + level(mins);
    if (isToday) cls += ' today';
    const tooltip = mins > 0 ? `<span class="tooltip">${mins}分钟</span>` : '';
    html += `<div class="${cls}">${d}${tooltip}</div>`;
  }
  cal.innerHTML = html;
}

function prevMonth() {
  if (state.calMonth === 0) { state.calMonth = 11; state.calYear--; }
  else state.calMonth--;
  renderCalendar();
}
function nextMonth() {
  if (state.calMonth === 11) { state.calMonth = 0; state.calYear++; }
  else state.calMonth++;
  renderCalendar();
}

  updatePointsDisplay();
  renderStore();
  showFloatPts('-' + p.cost);

// Achievement popup
let shownAchievements = LS.get('shownAchievements',[]);
function checkAchievements() {
  const newlyUnlocked = state.achievements.filter(a => {
    return checkUnlock(a) && !shownAchievements.includes(a.id);
  });
  if (newlyUnlocked.length === 0) return;
  const a = newlyUnlocked[0]; // show one at a time
  shownAchievements.push(a.id);
  LS.set('shownAchievements',shownAchievements);
  showAchievementPopup(a);
}

function showAchievementPopup(a) {
  const pop = document.createElement('div');
  pop.className = 'ach-popup';
  pop.innerHTML = `
    <div class="ach-popup-inner">
      <div class="ach-popup-badge">🏆</div>
      <div class="ach-popup-label">成就解锁！</div>
      <div class="ach-popup-icon">${a.icon}</div>
      <div class="ach-popup-name">${esc(a.name)}</div>
      <div class="ach-popup-desc">${esc(a.desc)}</div>
    </div>`;
  document.body.appendChild(pop);
  setTimeout(() => { pop.classList.add('show'); }, 50);
  setTimeout(() => { pop.classList.remove('show'); }, 3500);
  setTimeout(() => { pop.remove(); }, 4000);
}

function checkUnlock(s) {
  if (s.condType === 'streak') return state.streak >= s.condVal;
  if (s.condType === 'points') return state.totalMinutes >= s.condVal;
  if (s.condType === 'countdown') {
    const exam = new Date(state.examDate);
    const diff = Math.ceil((exam - new Date()) / 86400000);
    return diff <= s.condVal && diff > 0;
  }
  return false;
}

function getUnlockHint(s) {
  if (s.condType === 'streak') return `还差 ${Math.max(0,s.condVal-state.streak)} 天`;
  if (s.condType === 'points') return `还差 ${Math.max(0,s.condVal-state.totalMinutes)} 分钟`;
  if (s.condType === 'countdown') return `倒计时 ${s.condVal} 天时`;
  return '';
}

function switchPage(name) {
  const pages = {'today':0,'data':1,'store':2,'secrets':3};
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav .tab').forEach(t => t.classList.remove('active'));

  const pageEl = document.getElementById('page-' + name);
  if (pageEl) pageEl.classList.add('active');

  const tabs = document.querySelectorAll('nav .tab');
  for (const t of tabs) {
    if (t.dataset.page === name) t.classList.add('active');
  }

  if (name === 'data') renderData();
  if (name === 'store') renderStore();
  if (name === 'secrets') renderAchievements();
}
